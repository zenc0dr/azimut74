<!-- Vue 3 и Tailwind -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>[v-cloak] { display: none; }</style>

<div id="cookie-app" v-cloak>
    <div v-if="!consentGiven" class="fixed inset-0 z-50 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-xl p-6 max-w-lg w-full text-center space-y-4">
            <h2 class="text-xl font-semibold text-gray-800">🍪 Мы используем cookies</h2>
            <p class="text-gray-600 text-sm">Этот сайт использует cookies для улучшения работы. Пожалуйста, выбери категории, которые разрешаешь.</p>

            <div class="space-y-2 text-left">
                <label class="flex items-center space-x-2">
                    <input type="checkbox" disabled checked class="accent-blue-500">
                    <span class="text-sm">Обязательные cookies</span>
                </label>
                <label class="flex items-center space-x-2">
                    <input type="checkbox" v-model="analytics" class="accent-green-500">
                    <span class="text-sm">Аналитика</span>
                </label>
                <label class="flex items-center space-x-2">
                    <input type="checkbox" v-model="marketing" class="accent-pink-500">
                    <span class="text-sm">Маркетинг</span>
                </label>
            </div>

            <button @click="acceptCookies"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-xl w-full transition">
                Сохранить настройки
            </button>
        </div>
    </div>
</div>

<script>
    const app = Vue.createApp({
        data() {
            return {
                analytics: false,
                marketing: false,
                consentGiven: false
            };
        },
        mounted() {
            console.log('[mounted] Проверяем localStorage...');
            try {
                const savedConsent = localStorage.getItem('cookieConsent');
                if (savedConsent) {
                    const parsed = JSON.parse(savedConsent);
                    console.log('[mounted] Найдено согласие:', parsed);

                    if (parsed.necessary === true) {
                        this.consentGiven = true;
                        console.log('[mounted] consentGiven установлен в true');
                    } else {
                        console.log('[mounted] Обязательное согласие отсутствует');
                    }
                } else {
                    console.log('[mounted] Нет записи в localStorage');
                }
            } catch (e) {
                console.warn('[mounted] Ошибка при чтении localStorage:', e);
            }
        },
        methods: {
            acceptCookies() {
                console.log('[acceptCookies] Кнопка нажата');
                const consent = {
                    necessary: true,
                    analytics: this.analytics,
                    marketing: this.marketing,
                    timestamp: new Date().toISOString()
                };

                try {
                    localStorage.setItem('cookieConsent', JSON.stringify(consent));
                    console.log('[acceptCookies] Согласие сохранено:', consent);
                    this.consentGiven = true;
                    console.log('[acceptCookies] consentGiven теперь true');
                } catch (e) {
                    console.error('[acceptCookies] Ошибка при сохранении в localStorage:', e);
                }

                // Пример условной инициализации
                if (this.analytics) {
                    console.log('[acceptCookies] Аналитика разрешена');
                }
                if (this.marketing) {
                    console.log('[acceptCookies] Маркетинг разрешён');
                }
            }
        }
    });

    app.mount('#cookie-app');
</script>

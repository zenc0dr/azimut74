fields:
    is_published:
        label: Опубликован
        span: left
        default: 1
        type: switch
    name:
        label: Имя
        span: auto
        type: text
    phone:
        label: Телефон
        span: auto
        type: text
    email:
        label: email
        span: auto
        type: text
tabs:
    fields:
        admin_rating_cruise:
            label: Оценка отдыха в целом
            span: left
            min: 1
            max: 5
            type: number
            tab: Данные
        admin_rating_azimut:
            label: Оценка работы Азимут
            span: right
            min: 1
            max: 5
            type: number
            tab: Данные
        reviews_text:
            label: Текст отзыва
            size: giant
            span: full
            type: textarea
            tab: Данные
        review_meta:
            span: full
            path: $/zen/reviews/models/review/review.php
            type: partial
            tab: Данные
        photos:
            label: Фотографии
            mode: image
            useCaption: true
            thumbOptions:
                mode: crop
                extension: auto
            span: full
            type: fileupload
            tab: Фото
        photos_manage:
            span: full
            path: $/zen/reviews/models/review/photos_manage.php
            type: partial
            tab: Фото
